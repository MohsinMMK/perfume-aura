# Dependency-aware CI, immutable VPS ops deployment, and gated promotion to
# Hostinger's native GitHub storefront deployment branch.
name: ci-and-ops-artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Runtime surface to redeploy from the selected ref
        required: true
        default: none
        type: choice
        options:
          - none
          - storefront
          - ops
          - both

# Main releases serialize and never cancel mid-run: a started commit finishes
# even if newer main commits arrive; queued/latest push deploys afterward.
# GitHub may replace older pending runs in the concurrency group — acceptable
# because the newest remaining run still deploys. PRs may cancel superseded runs.
concurrency:
  group: ci-and-ops-artifact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  EXACT_NODE_VERSION: 24.6.0
  EXACT_NPM_VERSION: 11.5.1
  EXACT_PNPM_VERSION: 11.25.0

jobs:
  scope:
    name: deployment-impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_validate: ${{ steps.impact.outputs.should_validate }}
      should_publish: ${{ steps.impact.outputs.should_publish }}
      validate_ops: ${{ steps.impact.outputs.validate_ops }}
      validate_storefront: ${{ steps.impact.outputs.validate_storefront }}
      publish_ops: ${{ steps.impact.outputs.publish_ops }}
      publish_storefront: ${{ steps.impact.outputs.publish_storefront }}
      ops_migration_blocked: ${{ steps.impact.outputs.ops_migration_blocked }}
    steps:
      - name: Checkout deployment classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Push events can contain multiple rebased commits, so the event's
          # before SHA is not guaranteed to be within a two-commit checkout.
          fetch-depth: 0

      - name: Classify the main changeset
        id: impact
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEPLOY_TARGET: ${{ inputs.deploy_target || 'none' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$DEPLOY_TARGET" == "none" || "$DEPLOY_TARGET" == "ops" ||
               "$DEPLOY_TARGET" == "storefront" || "$DEPLOY_TARGET" == "both" ]]
            [[ "$DEPLOY_TARGET" != "none" ]] && SHOULD_PUBLISH=true || SHOULD_PUBLISH=false
            [[ "$DEPLOY_TARGET" == "ops" || "$DEPLOY_TARGET" == "both" ]] && PUBLISH_OPS=true || PUBLISH_OPS=false
            [[ "$DEPLOY_TARGET" == "storefront" || "$DEPLOY_TARGET" == "both" ]] && PUBLISH_STOREFRONT=true || PUBLISH_STOREFRONT=false
            if git cat-file -e "${GITHUB_SHA}^1^{commit}"; then
              OPS_MIGRATION_BLOCKED="$(
                git diff --name-only -z "${GITHUB_SHA}^1" "$GITHUB_SHA" |
                  node scripts/classify-deployment-impact.mjs --stdin0 |
                  sed -n 's/^ops_migration_blocked=//p'
              )"
            else
              # A root commit cannot prove a safe migration baseline.
              OPS_MIGRATION_BLOCKED=true
            fi
            [[ "$OPS_MIGRATION_BLOCKED" == "true" || "$OPS_MIGRATION_BLOCKED" == "false" ]]
            echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"
            echo "should_validate=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"
            echo "validate_ops=$PUBLISH_OPS" >> "$GITHUB_OUTPUT"
            echo "validate_storefront=$PUBLISH_STOREFRONT" >> "$GITHUB_OUTPUT"
            echo "publish_ops=$PUBLISH_OPS" >> "$GITHUB_OUTPUT"
            echo "publish_storefront=$PUBLISH_STOREFRONT" >> "$GITHUB_OUTPUT"
            echo "ops_migration_blocked=$OPS_MIGRATION_BLOCKED" >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              BASE_SHA="$PULL_REQUEST_BASE_SHA"
            else
              BASE_SHA="$BEFORE_SHA"
            fi
            if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
               [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]] ||
               ! git cat-file -e "${BASE_SHA}^{commit}"; then
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              echo "should_validate=true" >> "$GITHUB_OUTPUT"
              echo "validate_ops=true" >> "$GITHUB_OUTPUT"
              echo "validate_storefront=true" >> "$GITHUB_OUTPUT"
              echo "publish_ops=true" >> "$GITHUB_OUTPUT"
              echo "publish_storefront=true" >> "$GITHUB_OUTPUT"
              echo "ops_migration_blocked=true" >> "$GITHUB_OUTPUT"
            else
              git diff --name-only -z "$BASE_SHA" "$GITHUB_SHA" |
                node scripts/classify-deployment-impact.mjs --stdin0 \
                  --base "$BASE_SHA" --head "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            fi
          fi

  repository-contracts:
    name: repository-contracts
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repository and deployment contract self-tests
        run: pnpm deploy:self-test

  storefront-quality:
    name: storefront-quality
    if: needs.scope.outputs.validate_storefront == 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Storefront lint
        run: pnpm --filter @perfume-aura/storefront lint
      - name: Storefront dependency typecheck
        run: pnpm --filter @perfume-aura/ui --filter @perfume-aura/storefront typecheck
      - name: Storefront unit tests
        run: pnpm test:inventory && pnpm --filter @perfume-aura/storefront test:unit
      - name: Commerce contracts
        run: pnpm commerce:verify && pnpm commerce:verify:self-test
      - name: Storefront production build and client budget
        env:
          STOREFRONT_URL: https://perfumeaura.com
          CUSTOMER_AUTH_URL: https://perfumeaura.com
          STOREFRONT_CUSTOMER_AUTH_ENABLED: "false"
          STOREFRONT_PREVIEW_CATALOG: "false"
          STOREFRONT_PUBLIC_RELEASE: "false"
          STOREFRONT_CHECKOUT_RELEASE_APPROVED: "false"
          STOREFRONT_INQUIRIES_ENABLED: "false"
          STANDALONE_SOURCE_COMMIT: ${{ github.sha }}
          NEXT_PUBLIC_STOREFRONT_POSTHOG_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_STOREFRONT_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          NEXT_PUBLIC_STOREFRONT_SENTRY_DSN: ${{ vars.STOREFRONT_SENTRY_DSN }}
          NEXT_PUBLIC_STOREFRONT_SENTRY_TRACES_SAMPLE_RATE: "0.1"
          SENTRY_ORG: khanect
          STOREFRONT_SENTRY_PROJECT: perfume-aura-storefront
        run: pnpm build:storefront && pnpm storefront:verify-client-budget

  ops-quality:
    name: ops-quality
    if: needs.scope.outputs.validate_ops == 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ops lint
        run: pnpm --filter @perfume-aura/ops lint
      - name: Ops dependency typecheck
        run: pnpm --filter @perfume-aura/ui --filter @perfume-aura/validators --filter @perfume-aura/ops typecheck
      - name: Ops unit tests
        run: pnpm test:inventory && pnpm --filter @perfume-aura/ops test:unit
      - name: Ops production build and client budget
        env:
          BETTER_AUTH_URL: https://app.perfumeaura.com
          STANDALONE_SOURCE_COMMIT: ${{ github.sha }}
          NEXT_PUBLIC_OPS_POSTHOG_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_OPS_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          NEXT_PUBLIC_OPS_SENTRY_DSN: ${{ vars.OPS_SENTRY_DSN }}
          NEXT_PUBLIC_OPS_SENTRY_TRACES_SAMPLE_RATE: "0.1"
          SENTRY_ORG: khanect
          OPS_SENTRY_PROJECT: perfume-aura-ops
        run: pnpm build:ops && pnpm ops:verify-client-budget

  dependency-audit:
    name: dependency-audit
    if: needs.scope.outputs.should_validate == 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Affected pnpm production dependency audit
        run: pnpm audit --prod --audit-level=low
      - name: Ops image runtime dependency audit
        if: needs.scope.outputs.validate_ops == 'true'
        run: npm audit --omit=dev --audit-level=low --prefix scripts/ops-runtime-deps

  database-integration:
    name: shared-database-integration
    if: needs.scope.outputs.should_validate == 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: perfume_aura_phase99_ci_shared
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d perfume_aura_phase99_ci_shared"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase99_ci_shared
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase99_ci_shared
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase99_ci_shared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Shared database typecheck and unit tests
        run: pnpm --filter @perfume-aura/db typecheck && pnpm --filter @perfume-aura/db test:unit
      - run: pnpm db:migrate
      - run: pnpm --filter @perfume-aura/db test:integration

  storefront-integration:
    name: storefront-integration
    if: needs.scope.outputs.validate_storefront == 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: perfume_aura_phase99_ci_storefront }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d perfume_aura_phase99_ci_storefront"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase99_ci_storefront
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase99_ci_storefront
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase99_ci_storefront
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: 11.25.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @perfume-aura/storefront test:integration

  ops-integration:
    name: ops-integration
    if: needs.scope.outputs.validate_ops == 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: perfume_aura_phase99_ci_ops }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d perfume_aura_phase99_ci_ops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase99_ci_ops
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase99_ci_ops
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase99_ci_ops
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: 11.25.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @perfume-aura/ops test:integration

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with: { fail-on-severity: high }

  storefront-source-build:
    name: verified-storefront-source-build
    if: needs.scope.outputs.validate_storefront == 'true'
    needs: [scope, storefront-quality, storefront-integration, database-integration, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: 11.25.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - name: Reproduce the Hostinger Git source build
        env:
          NEXT_PUBLIC_STOREFRONT_POSTHOG_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_STOREFRONT_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          NEXT_PUBLIC_STOREFRONT_SENTRY_DSN: ${{ vars.STOREFRONT_SENTRY_DSN }}
          NEXT_PUBLIC_STOREFRONT_SENTRY_TRACES_SAMPLE_RATE: "0.1"
        run: pnpm hostinger:build:storefront
      - name: Verify source manifest
        run: node -e 'const m=require("./.hostinger/storefront/source-manifest.json");if(m.source.commit!==process.env.GITHUB_SHA||m.source.dirty||m.source.type!=="git")process.exit(1)'

  ops-package:
    name: verified-ops-artifact
    if: needs.scope.outputs.validate_ops == 'true'
    needs: [scope, ops-quality, ops-integration, database-integration, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: perfume_aura_phase99_package_ops }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d perfume_aura_phase99_package_ops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase99_package_ops
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase99_package_ops
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase99_package_ops
      BETTER_AUTH_URL: https://app.perfumeaura.com
      STANDALONE_REQUIRE_SERVER_SMOKE: "1"
      NEXT_PUBLIC_OPS_POSTHOG_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
      NEXT_PUBLIC_OPS_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      NEXT_PUBLIC_OPS_SENTRY_DSN: ${{ vars.OPS_SENTRY_DSN }}
      NEXT_PUBLIC_OPS_SENTRY_TRACES_SAMPLE_RATE: "0.1"
      SENTRY_ORG: khanect
      OPS_SENTRY_PROJECT: perfume-aura-ops
      SENTRY_AUTH_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SENTRY_AUTH_TOKEN || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: 11.25.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Build and verify ops standalone artifact
        run: STANDALONE_SOURCE_COMMIT="$GITHUB_SHA" STANDALONE_STAMP="${GITHUB_SHA:0:12}" pnpm ops:pack
      - name: Validate hardened ops container image
        id: artifact
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          ZIP="dist/perfume-aura-standalone_${SHORT_SHA}.zip"
          CHECKSUM="${ZIP}.sha256"
          MANIFEST="dist/perfume-aura-standalone_${SHORT_SHA}.manifest.json"
          (cd dist && sha256sum --check "$(basename "$CHECKSUM")")
          TREE="$(mktemp -d "${RUNNER_TEMP}/ops-image-tree.XXXXXX")"
          trap 'rm -rf -- "$TREE"' EXIT
          python3 scripts/extract-hostinger-ops-zip.py "$ZIP" "$TREE"
          node scripts/verify-hostinger-ops-deploy-tree.mjs "$TREE" "$GITHUB_SHA"
          docker build --build-arg "SOURCE_COMMIT=$GITHUB_SHA" --file deploy/ops-vps/Dockerfile --tag perfume-aura-ops:ci "$TREE"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' perfume-aura-ops:ci)" = "$GITHUB_SHA"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
      - name: Upload inspected ops artifact
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ops-standalone-${{ steps.artifact.outputs.short_sha }}
          path: |
            dist/perfume-aura-standalone_${{ steps.artifact.outputs.short_sha }}.zip
            dist/perfume-aura-standalone_${{ steps.artifact.outputs.short_sha }}.zip.sha256
            dist/perfume-aura-standalone_${{ steps.artifact.outputs.short_sha }}.manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # Preserve the existing protected-branch contexts while the workflow moves
  # to dependency-aware job names. These always report a result, including for
  # documentation-only changes where the underlying work is intentionally
  # skipped.
  database-required-context:
    name: postgresql-16-integration
    if: always()
    needs: [scope, database-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Verify the planned database result
        env:
          SHOULD_VALIDATE: ${{ needs.scope.outputs.should_validate }}
          DATABASE_INTEGRATION: ${{ needs.database-integration.result }}
        run: |
          set -euo pipefail
          if [[ "$SHOULD_VALIDATE" == true ]]; then
            test "$DATABASE_INTEGRATION" = success
          else
            test "$DATABASE_INTEGRATION" = skipped
          fi

  package-required-context:
    name: verified-hostinger-zip
    if: always()
    needs: [scope, storefront-source-build, ops-package]
    runs-on: ubuntu-latest
    steps:
      - name: Verify the planned deployable results
        env:
          VALIDATE_STOREFRONT: ${{ needs.scope.outputs.validate_storefront }}
          VALIDATE_OPS: ${{ needs.scope.outputs.validate_ops }}
          STOREFRONT_SOURCE_BUILD: ${{ needs.storefront-source-build.result }}
          OPS_PACKAGE: ${{ needs.ops-package.result }}
        run: |
          set -euo pipefail
          require_result() {
            if [[ "$1" == true ]]; then
              test "$2" = success
            else
              test "$2" = skipped
            fi
          }
          require_result "$VALIDATE_STOREFRONT" "$STOREFRONT_SOURCE_BUILD"
          require_result "$VALIDATE_OPS" "$OPS_PACKAGE"

  quality:
    name: quality
    if: always()
    needs: [scope, repository-contracts, storefront-quality, ops-quality, dependency-audit, database-integration, storefront-integration, ops-integration, storefront-source-build, ops-package]
    runs-on: ubuntu-latest
    steps:
      - name: Require every planned check and no unplanned work
        env:
          VALIDATE_STOREFRONT: ${{ needs.scope.outputs.validate_storefront }}
          VALIDATE_OPS: ${{ needs.scope.outputs.validate_ops }}
          CONTRACTS: ${{ needs.repository-contracts.result }}
          STOREFRONT_QUALITY: ${{ needs.storefront-quality.result }}
          OPS_QUALITY: ${{ needs.ops-quality.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
          DATABASE_INTEGRATION: ${{ needs.database-integration.result }}
          STOREFRONT_INTEGRATION: ${{ needs.storefront-integration.result }}
          OPS_INTEGRATION: ${{ needs.ops-integration.result }}
          STOREFRONT_SOURCE_BUILD: ${{ needs.storefront-source-build.result }}
          OPS_PACKAGE: ${{ needs.ops-package.result }}
        run: |
          set -euo pipefail
          test "$CONTRACTS" = success
          require_result() {
            if [[ "$1" == true ]]; then
              test "$2" = success
            else
              test "$2" = skipped
            fi
          }
          require_result "$VALIDATE_STOREFRONT" "$STOREFRONT_QUALITY"
          require_result "$VALIDATE_STOREFRONT" "$STOREFRONT_INTEGRATION"
          require_result "$VALIDATE_STOREFRONT" "$STOREFRONT_SOURCE_BUILD"
          require_result "$VALIDATE_OPS" "$OPS_QUALITY"
          require_result "$VALIDATE_OPS" "$OPS_INTEGRATION"
          require_result "$VALIDATE_OPS" "$OPS_PACKAGE"
          if [[ "$VALIDATE_STOREFRONT" == true || "$VALIDATE_OPS" == true ]]; then
            test "$DEPENDENCY_AUDIT" = success
            test "$DATABASE_INTEGRATION" = success
          else
            test "$DEPENDENCY_AUDIT" = skipped
            test "$DATABASE_INTEGRATION" = skipped
          fi

  publish-and-deploy-vps-ops:
    name: publish-and-deploy-vps-ops
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      needs.ops-package.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      needs.scope.outputs.publish_ops == 'true' &&
      needs.scope.outputs.ops_migration_blocked != 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - scope
      - quality
      - ops-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: perfume-aura-ops-vps-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout deploy assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Resolve artifact name
        id: meta
        run: echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Download exact package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ops-standalone-${{ steps.meta.outputs.short_sha }}
          path: dist-publish

      - name: Re-verify and extract exact ops artifact
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          ZIP="dist-publish/perfume-aura-standalone_${SHORT_SHA}.zip"
          CHECKSUM="${ZIP}.sha256"
          MANIFEST="dist-publish/perfume-aura-standalone_${SHORT_SHA}.manifest.json"
          test -f "$ZIP"
          test -f "$CHECKSUM"
          test -f "$MANIFEST"
          (cd dist-publish && sha256sum --check "$(basename "$CHECKSUM")")
          mkdir "$RUNNER_TEMP/ops-image-tree"
          python3 scripts/extract-hostinger-ops-zip.py "$ZIP" "$RUNNER_TEMP/ops-image-tree"
          node scripts/verify-hostinger-ops-deploy-tree.mjs "$RUNNER_TEMP/ops-image-tree" "$GITHUB_SHA"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push immutable ops image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/ops-image-tree
          file: ${{ github.workspace }}/deploy/ops-vps/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mohsinmmk/perfume-aura-ops:${{ github.sha }}
          build-args: SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=perfume-aura-ops
          cache-to: type=gha,mode=max,scope=perfume-aura-ops

      - name: Verify immutable image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Connect deployment runner to Tailscale
        if: vars.VPS_OPS_AUTO_DEPLOY_ENABLED == 'true'
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.VPS_OPS_TAILSCALE_IP }}

      - name: Prepare restricted VPS SSH identity
        if: vars.VPS_OPS_AUTO_DEPLOY_ENABLED == 'true'
        env:
          VPS_OPS_KNOWN_HOSTS: ${{ secrets.VPS_OPS_KNOWN_HOSTS }}
          VPS_OPS_SSH_KEY: ${{ secrets.VPS_OPS_SSH_KEY }}
        run: |
          set -euo pipefail
          SSH_ROOT="$RUNNER_TEMP/perfume-aura-ops-ssh"
          install -d -m 0700 "$SSH_ROOT"
          printf '%s\n' "$VPS_OPS_SSH_KEY" > "$SSH_ROOT/id_ed25519"
          printf '%s\n' "$VPS_OPS_KNOWN_HOSTS" > "$SSH_ROOT/known_hosts"
          chmod 0600 "$SSH_ROOT/id_ed25519" "$SSH_ROOT/known_hosts"
          ssh-keygen -y -f "$SSH_ROOT/id_ed25519" >/dev/null

      - name: Deploy exact image through restricted VPS command
        if: vars.VPS_OPS_AUTO_DEPLOY_ENABLED == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          VPS_OPS_TAILSCALE_IP: ${{ vars.VPS_OPS_TAILSCALE_IP }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$VPS_OPS_TAILSCALE_IP" =~ ^100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]
          SSH_ROOT="$RUNNER_TEMP/perfume-aura-ops-ssh"
          ssh \
            -i "$SSH_ROOT/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_ROOT/known_hosts" \
            "perfume-deploy@$VPS_OPS_TAILSCALE_IP" \
            "deploy $SOURCE_SHA $IMAGE_DIGEST"

      - name: Verify exact production release
        if: >-
          vars.VPS_OPS_AUTO_DEPLOY_ENABLED == 'true' &&
          vars.VPS_OPS_PUBLIC_VERIFICATION_ENABLED == 'true'
        run: |
          set -euo pipefail
          node scripts/verify-production-deploy.mjs "$GITHUB_SHA" \
            --target ops \
            --public-surface storefront \
            --public-base https://perfumeaura.com \
            --www-base https://www.perfumeaura.com \
            --timeout-ms 1200000

  block-runtime-deploy-on-database-migration:
    name: block-runtime-deploy-on-database-migration
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      needs.scope.outputs.should_publish == 'true' &&
      needs.scope.outputs.ops_migration_blocked == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - scope
      - quality
    runs-on: ubuntu-latest
    steps:
      - name: Require the production database owner gate
        run: |
          echo "Database migration files changed. Apply and verify the migration and restricted runtime grants through the documented owner gate before redeploying either runtime." >&2
          exit 1

  promote-hostinger-storefront-source:
    name: promote-hostinger-storefront-source
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      needs.storefront-source-build.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      needs.scope.outputs.publish_storefront == 'true' &&
      needs.scope.outputs.ops_migration_blocked != 'true' &&
      vars.HOSTINGER_STOREFRONT_GIT_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - scope
      - quality
      - storefront-source-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-hostinger-storefront-production
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout the exact accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Advance the protected Hostinger source branch
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if git ls-remote --exit-code --heads origin hostinger-storefront-production >/dev/null 2>&1; then
            git fetch origin hostinger-storefront-production
            git merge-base --is-ancestor origin/hostinger-storefront-production "$GITHUB_SHA"
          fi
          git push origin "$GITHUB_SHA:refs/heads/hostinger-storefront-production"

  verify-hostinger-storefront:
    name: verify-hostinger-storefront-live
    if: >-
      always() &&
      needs.promote-hostinger-storefront-source.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      needs.scope.outputs.publish_storefront == 'true' &&
      vars.HOSTINGER_STOREFRONT_GIT_DEPLOY_ENABLED == 'true' &&
      vars.HOSTINGER_STOREFRONT_PUBLIC_VERIFICATION_ENABLED == 'true'
    needs:
      - scope
      - promote-hostinger-storefront-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Poll exact storefront version and smoke public surfaces
        run: |
          set -euo pipefail
          node scripts/verify-production-deploy.mjs "$GITHUB_SHA" \
            --target storefront \
            --public-surface storefront \
            --public-base https://perfumeaura.com \
            --www-base https://www.perfumeaura.com \
            --timeout-ms 1200000
