# CI gate, verified standalone packs, VPS ops deployment, and storefront branch publishing.
# Pure Hostinger monorepo source build (Path G) remains blocked by esbuild EACCES.
# Hostinger watches the exact prebuilt storefront branch; ZIP remains an emergency fallback.
name: ci-and-ops-artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Runtime surface to redeploy from the selected ref
        required: true
        default: none
        type: choice
        options:
          - none
          - storefront
          - ops
          - both

# Main releases serialize and never cancel mid-run: a started commit finishes
# even if newer main commits arrive; queued/latest push deploys afterward.
# GitHub may replace older pending runs in the concurrency group — acceptable
# because the newest remaining run still deploys. PRs may cancel superseded runs.
concurrency:
  group: ci-and-ops-artifact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  EXACT_NODE_VERSION: 24.6.0
  EXACT_NPM_VERSION: 11.5.1
  EXACT_PNPM_VERSION: 10.32.1
  HOSTINGER_STOREFRONT_BRANCH: hostinger-storefront-production

jobs:
  deployment-impact:
    name: deployment-impact
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_publish: ${{ steps.impact.outputs.should_publish }}
      publish_ops: ${{ steps.impact.outputs.publish_ops }}
      publish_storefront: ${{ steps.impact.outputs.publish_storefront }}
      ops_migration_blocked: ${{ steps.impact.outputs.ops_migration_blocked }}
    steps:
      - name: Checkout deployment classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Classify the main changeset
        id: impact
        env:
          BEFORE_SHA: ${{ github.event.before }}
          DEPLOY_TARGET: ${{ inputs.deploy_target || 'none' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$DEPLOY_TARGET" == "none" || "$DEPLOY_TARGET" == "ops" ||
               "$DEPLOY_TARGET" == "storefront" || "$DEPLOY_TARGET" == "both" ]]
            [[ "$DEPLOY_TARGET" != "none" ]] && SHOULD_PUBLISH=true || SHOULD_PUBLISH=false
            [[ "$DEPLOY_TARGET" == "ops" || "$DEPLOY_TARGET" == "both" ]] && PUBLISH_OPS=true || PUBLISH_OPS=false
            [[ "$DEPLOY_TARGET" == "storefront" || "$DEPLOY_TARGET" == "both" ]] && PUBLISH_STOREFRONT=true || PUBLISH_STOREFRONT=false
            if git cat-file -e "${GITHUB_SHA}^1^{commit}"; then
              OPS_MIGRATION_BLOCKED="$(
                git diff --name-only -z "${GITHUB_SHA}^1" "$GITHUB_SHA" |
                  node scripts/classify-deployment-impact.mjs --stdin0 |
                  sed -n 's/^ops_migration_blocked=//p'
              )"
            else
              # A root commit cannot prove a safe migration baseline.
              OPS_MIGRATION_BLOCKED=true
            fi
            [[ "$OPS_MIGRATION_BLOCKED" == "true" || "$OPS_MIGRATION_BLOCKED" == "false" ]]
            echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"
            echo "publish_ops=$PUBLISH_OPS" >> "$GITHUB_OUTPUT"
            echo "publish_storefront=$PUBLISH_STOREFRONT" >> "$GITHUB_OUTPUT"
            echo "ops_migration_blocked=$OPS_MIGRATION_BLOCKED" >> "$GITHUB_OUTPUT"
          else
            if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
               [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]] ||
               ! git cat-file -e "${BEFORE_SHA}^{commit}"; then
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              echo "publish_ops=true" >> "$GITHUB_OUTPUT"
              echo "publish_storefront=true" >> "$GITHUB_OUTPUT"
              echo "ops_migration_blocked=false" >> "$GITHUB_OUTPUT"
            else
              git diff --name-only -z "$BEFORE_SHA" "$GITHUB_SHA" |
                node scripts/classify-deployment-impact.mjs --stdin0 >> "$GITHUB_OUTPUT"
            fi
          fi

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1

      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify runtime contract
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = "$EXACT_NODE_VERSION"
          test "$(npm --version)" = "$EXACT_NPM_VERSION"
          test "$(pnpm --version)" = "$EXACT_PNPM_VERSION"
          test "$(tr -d '[:space:]' < .nvmrc)" = "$EXACT_NODE_VERSION"
          test "$(tr -d '[:space:]' < .node-version)" = "$EXACT_NODE_VERSION"

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Deploy automation self-tests
        run: pnpm deploy:self-test

      - name: Lint
        run: pnpm lint

      - name: Workspace typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Production dependency audit
        run: pnpm security:audit

      - name: Storefront production build
        env:
          STOREFRONT_URL: https://perfumeaura.com
          CUSTOMER_AUTH_URL: https://perfumeaura.com
          STOREFRONT_CUSTOMER_AUTH_ENABLED: "false"
          STOREFRONT_PREVIEW_CATALOG: "false"
          STOREFRONT_PUBLIC_RELEASE: "false"
          STOREFRONT_CHECKOUT_RELEASE_APPROVED: "false"
          STOREFRONT_INQUIRIES_ENABLED: "false"
          STANDALONE_SOURCE_COMMIT: ${{ github.sha }}
          NEXT_PUBLIC_STOREFRONT_POSTHOG_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_STOREFRONT_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          NEXT_PUBLIC_STOREFRONT_SENTRY_DSN: ${{ vars.STOREFRONT_SENTRY_DSN }}
          NEXT_PUBLIC_STOREFRONT_SENTRY_TRACES_SAMPLE_RATE: "0.1"
          SENTRY_ORG: khanect
          STOREFRONT_SENTRY_PROJECT: perfume-aura-storefront
        run: pnpm build:storefront

      - name: Ops production build
        env:
          BETTER_AUTH_URL: https://app.perfumeaura.com
          STANDALONE_SOURCE_COMMIT: ${{ github.sha }}
          NEXT_PUBLIC_OPS_POSTHOG_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_OPS_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          NEXT_PUBLIC_OPS_SENTRY_DSN: ${{ vars.OPS_SENTRY_DSN }}
          NEXT_PUBLIC_OPS_SENTRY_TRACES_SAMPLE_RATE: "0.1"
          SENTRY_ORG: khanect
          OPS_SENTRY_PROJECT: perfume-aura-ops
        run: pnpm build:ops

  integration:
    name: postgresql-16-integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: perfume_aura_phase06_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d perfume_aura_phase06_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase06_ci
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase06_ci
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase06_ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1

      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify runtime contract
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = "$EXACT_NODE_VERSION"
          test "$(npm --version)" = "$EXACT_NPM_VERSION"
          test "$(pnpm --version)" = "$EXACT_PNPM_VERSION"

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Apply forward migrations
        run: pnpm db:migrate

      - name: Complete integration suite (no skips)
        run: pnpm test:integration

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review changed dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  package:
    name: verified-hostinger-zip
    needs:
      - quality
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: perfume_aura_phase06_package
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d perfume_aura_phase06_package"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase06_package
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase06_package
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase06_package
      BETTER_AUTH_URL: https://app.perfumeaura.com
      STANDALONE_REQUIRE_SERVER_SMOKE: "1"
      NEXT_PUBLIC_STOREFRONT_POSTHOG_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
      NEXT_PUBLIC_STOREFRONT_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      NEXT_PUBLIC_STOREFRONT_SENTRY_DSN: ${{ vars.STOREFRONT_SENTRY_DSN }}
      NEXT_PUBLIC_STOREFRONT_SENTRY_TRACES_SAMPLE_RATE: "0.1"
      NEXT_PUBLIC_OPS_POSTHOG_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
      NEXT_PUBLIC_OPS_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      NEXT_PUBLIC_OPS_SENTRY_DSN: ${{ vars.OPS_SENTRY_DSN }}
      NEXT_PUBLIC_OPS_SENTRY_TRACES_SAMPLE_RATE: "0.1"
      SENTRY_ORG: khanect
      STOREFRONT_SENTRY_PROJECT: perfume-aura-storefront
      OPS_SENTRY_PROJECT: perfume-aura-ops
      SENTRY_AUTH_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SENTRY_AUTH_TOKEN || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1

      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify runtime contract
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = "$EXACT_NODE_VERSION"
          test "$(npm --version)" = "$EXACT_NPM_VERSION"
          test "$(pnpm --version)" = "$EXACT_PNPM_VERSION"

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Apply forward migrations for server smoke
        run: pnpm db:migrate

      - name: Build and verify standalone archives
        run: |
          set -euo pipefail
          export STANDALONE_SOURCE_COMMIT="$GITHUB_SHA"
          export STANDALONE_STAMP="${GITHUB_SHA:0:12}"
          pnpm ops:pack
          pnpm storefront:pack

      - name: Verify checksum and release metadata
        id: artifact
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          ZIP="dist/perfume-aura-standalone_${SHORT_SHA}.zip"
          CHECKSUM="${ZIP}.sha256"
          MANIFEST="dist/perfume-aura-standalone_${SHORT_SHA}.manifest.json"
          test -f "$ZIP"
          test -f "$CHECKSUM"
          test -f "$MANIFEST"
          (cd dist && sha256sum --check "$(basename "$CHECKSUM")")
          node - "$MANIFEST" "$GITHUB_SHA" <<'NODE'
          const assert = require("node:assert/strict");
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const [manifestPath, sourceCommit] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          assert.equal(manifest.source.commit, sourceCommit);
          assert.equal(manifest.source.dirty, false);
          assert.equal(manifest.runtime.node, "24.6.0");
          assert.equal(manifest.runtime.npm, "11.5.1");
          assert.equal(manifest.runtime.pnpm, "10.32.1");
          assert.equal(manifest.runtime.next, "16.2.11");
          assert.equal(manifest.runtime.sharp, "0.35.3");
          assert.equal(manifest.runtime.postcss, "8.5.23");
          const runtimeLockSha256 = crypto
            .createHash("sha256")
            .update(fs.readFileSync("scripts/ops-runtime-deps/package-lock.json"))
            .digest("hex");
          assert.deepEqual(manifest.runtimeDependencyLock, {
            source: "scripts/ops-runtime-deps/package-lock.json",
            artifact: "runtime-package-lock.json",
            sha256: runtimeLockSha256,
          });
          assert.ok(manifest.archive.bytes <= 50_000_000);
          NODE
          STOREFRONT_ZIP="dist/perfume-aura-storefront_${SHORT_SHA}.zip"
          STOREFRONT_CHECKSUM="${STOREFRONT_ZIP}.sha256"
          STOREFRONT_MANIFEST="dist/perfume-aura-storefront_${SHORT_SHA}.manifest.json"
          test -f "$STOREFRONT_ZIP"
          test -f "$STOREFRONT_CHECKSUM"
          test -f "$STOREFRONT_MANIFEST"
          (cd dist && sha256sum --check "$(basename "$STOREFRONT_CHECKSUM")")
          node - "$STOREFRONT_MANIFEST" "$GITHUB_SHA" <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const [manifestPath, sourceCommit] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          assert.equal(manifest.schemaVersion, 2);
          assert.equal(manifest.application, "@perfume-aura/storefront");
          assert.equal(manifest.source.commit, sourceCommit);
          assert.equal(manifest.source.dirty, false);
          assert.equal(manifest.entry, "apps/storefront/server.js");
          assert.equal(manifest.extractedSmoke, "passed");
          assert.equal(manifest.runtime.node, "24.6.0");
          assert.equal(manifest.runtime.npm, "11.5.1");
          assert.equal(manifest.runtime.pnpm, "10.32.1");
          assert.equal(manifest.runtime.next, "16.2.11");
          assert.equal(manifest.runtime.sharp, "0.35.3");
          assert.equal(manifest.runtime.postcss, "8.5.23");
          assert.ok(manifest.archive.bytes <= 50_000_000);
          NODE
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"
          echo "storefront_zip=$STOREFRONT_ZIP" >> "$GITHUB_OUTPUT"
          echo "storefront_checksum=$STOREFRONT_CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "storefront_manifest=$STOREFRONT_MANIFEST" >> "$GITHUB_OUTPUT"
          echo "artifact_name=hostinger-standalone-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Validate hardened ops container image
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          ZIP="dist/perfume-aura-standalone_${SHORT_SHA}.zip"
          TREE="$(mktemp -d "${RUNNER_TEMP}/ops-image-tree.XXXXXX")"
          cleanup() {
            rm -rf -- "$TREE"
          }
          trap cleanup EXIT
          python3 scripts/extract-hostinger-ops-zip.py "$ZIP" "$TREE"
          node scripts/verify-hostinger-ops-deploy-tree.mjs "$TREE" "$GITHUB_SHA"
          docker build \
            --build-arg "SOURCE_COMMIT=$GITHUB_SHA" \
            --file deploy/ops-vps/Dockerfile \
            --tag perfume-aura-ops:ci \
            "$TREE"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' perfume-aura-ops:ci)" = "$GITHUB_SHA"
          test "$(docker run --rm --entrypoint node perfume-aura-ops:ci -e 'const m=require("/app/artifact-manifest.json");process.stdout.write(m.source.commit)')" = "$GITHUB_SHA"

      - name: Upload inspected artifact
        if: >-
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hostinger-standalone-${{ steps.artifact.outputs.short_sha }}
          path: |
            ${{ steps.artifact.outputs.zip }}
            ${{ steps.artifact.outputs.checksum }}
            ${{ steps.artifact.outputs.manifest }}
            ${{ steps.artifact.outputs.storefront_zip }}
            ${{ steps.artifact.outputs.storefront_checksum }}
            ${{ steps.artifact.outputs.storefront_manifest }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-and-deploy-vps-ops:
    name: publish-and-deploy-vps-ops
    if: >-
      needs.deployment-impact.outputs.publish_ops == 'true' &&
      needs.deployment-impact.outputs.ops_migration_blocked != 'true' &&
      ((github.ref == 'refs/heads/main' && github.event_name == 'push') ||
       github.event_name == 'workflow_dispatch')
    needs:
      - deployment-impact
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: perfume-aura-ops-vps-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout deploy assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Resolve artifact name
        id: meta
        run: echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Download exact package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hostinger-standalone-${{ steps.meta.outputs.short_sha }}
          path: dist-publish

      - name: Re-verify and extract exact ops artifact
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          ZIP="dist-publish/perfume-aura-standalone_${SHORT_SHA}.zip"
          CHECKSUM="${ZIP}.sha256"
          MANIFEST="dist-publish/perfume-aura-standalone_${SHORT_SHA}.manifest.json"
          test -f "$ZIP"
          test -f "$CHECKSUM"
          test -f "$MANIFEST"
          (cd dist-publish && sha256sum --check "$(basename "$CHECKSUM")")
          mkdir "$RUNNER_TEMP/ops-image-tree"
          python3 scripts/extract-hostinger-ops-zip.py "$ZIP" "$RUNNER_TEMP/ops-image-tree"
          node scripts/verify-hostinger-ops-deploy-tree.mjs "$RUNNER_TEMP/ops-image-tree" "$GITHUB_SHA"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push immutable ops image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/ops-image-tree
          file: ${{ github.workspace }}/deploy/ops-vps/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mohsinmmk/perfume-aura-ops:${{ github.sha }}
          build-args: SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=perfume-aura-ops
          cache-to: type=gha,mode=max,scope=perfume-aura-ops

      - name: Verify immutable image digest
        run: |
          set -euo pipefail
          [[ "${{ steps.image.outputs.digest }}" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Deploy through Hostinger VPS API
        if: vars.VPS_OPS_AUTO_DEPLOY_ENABLED == 'true'
        uses: hostinger/deploy-on-vps@b0868cec74bfa63af6bfa7bdb0dfee2f9bef13ea # v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: perfume-aura-ops
          docker-compose-path: deploy/ops-vps/compose.yaml
          environment-variables: |
            PERFUME_AURA_OPS_IMAGE=ghcr.io/mohsinmmk/perfume-aura-ops@${{ steps.image.outputs.digest }}
            PERFUME_AURA_OPS_SOURCE_SHA=${{ github.sha }}

      - name: Verify exact production release
        if: >-
          vars.VPS_OPS_AUTO_DEPLOY_ENABLED == 'true' &&
          vars.VPS_OPS_PUBLIC_VERIFICATION_ENABLED == 'true'
        run: |
          set -euo pipefail
          node scripts/verify-production-deploy.mjs "$GITHUB_SHA" \
            --target ops \
            --public-surface storefront \
            --public-base https://perfumeaura.com \
            --timeout-ms 1200000

  block-runtime-deploy-on-database-migration:
    name: block-runtime-deploy-on-database-migration
    if: >-
      needs.deployment-impact.outputs.ops_migration_blocked == 'true' &&
      ((github.ref == 'refs/heads/main' && github.event_name == 'push') ||
       github.event_name == 'workflow_dispatch')
    needs:
      - deployment-impact
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Require the production database owner gate
        run: |
          echo "Database migration files changed. Apply and verify the migration and restricted runtime grants through the documented owner gate before redeploying either runtime." >&2
          exit 1

  publish-hostinger-storefront:
    name: publish-hostinger-storefront-branch
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.deployment-impact.outputs.publish_storefront == 'true' &&
      needs.deployment-impact.outputs.ops_migration_blocked != 'true'
    needs:
      - deployment-impact
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: publish-hostinger-storefront-production
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout scripts only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Resolve artifact name
        id: meta
        run: |
          set -euo pipefail
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Download exact package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hostinger-standalone-${{ steps.meta.outputs.short_sha }}
          path: dist-publish

      - name: Re-verify artifact and publish generated branch
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          ZIP="dist-publish/perfume-aura-storefront_${SHORT_SHA}.zip"
          CHECKSUM="${ZIP}.sha256"
          MANIFEST="dist-publish/perfume-aura-storefront_${SHORT_SHA}.manifest.json"
          test -f "$ZIP"
          test -f "$CHECKSUM"
          test -f "$MANIFEST"
          (
            cd dist-publish
            sha256sum --check "$(basename "$CHECKSUM")"
          )
          node - "$MANIFEST" "$GITHUB_SHA" <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const [manifestPath, sourceCommit] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          assert.equal(manifest.schemaVersion, 2);
          assert.equal(manifest.application, "@perfume-aura/storefront");
          assert.equal(manifest.source.commit, sourceCommit);
          assert.equal(manifest.source.dirty, false);
          assert.equal(manifest.entry, "apps/storefront/server.js");
          assert.ok(manifest.archive && manifest.archive.sha256);
          assert.equal(manifest.extractedSmoke, "passed");
          NODE

          TREE="$(mktemp -d "${RUNNER_TEMP}/hostinger-storefront-tree.XXXXXX")"
          cleanup() {
            rm -rf -- "$TREE"
          }
          trap cleanup EXIT

          python3 scripts/extract-hostinger-ops-zip.py "$ZIP" "$TREE"
          node scripts/verify-hostinger-ops-deploy-tree.mjs \
            "$TREE" "$GITHUB_SHA" --surface storefront
          bash scripts/publish-hostinger-ops-branch.sh \
            --tree "$TREE" \
            --commit "$GITHUB_SHA" \
            --surface storefront \
            --branch "$HOSTINGER_STOREFRONT_BRANCH" \
            --remote origin

  verify-hostinger-storefront:
    name: verify-hostinger-storefront-live
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.deployment-impact.outputs.publish_storefront == 'true' &&
      vars.HOSTINGER_STOREFRONT_AUTO_DEPLOY_ENABLED == 'true'
    needs:
      - deployment-impact
      - publish-hostinger-storefront
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Poll exact storefront version and smoke public surfaces
        run: |
          set -euo pipefail
          node scripts/verify-production-deploy.mjs "$GITHUB_SHA" \
            --target storefront \
            --public-surface storefront \
            --public-base https://perfumeaura.com \
            --www-base https://www.perfumeaura.com \
            --timeout-ms 1200000
