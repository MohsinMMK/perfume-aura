# CI gate, verified standalone pack, and automated Hostinger ops branch publish.
# Pure Hostinger monorepo source build (Path G) remains blocked by esbuild EACCES.
# Routine ops target: publish exact prebuilt tree to branch hostinger-ops-production.
# Production Hostinger watches the generated branch; Path Z is emergency fallback only.
name: ci-and-ops-artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Main releases serialize and never cancel mid-run: a started commit finishes
# even if newer main commits arrive; queued/latest push deploys afterward.
# GitHub may replace older pending runs in the concurrency group — acceptable
# because the newest remaining run still deploys. PRs may cancel superseded runs.
concurrency:
  group: ci-and-ops-artifact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  EXACT_NODE_VERSION: 24.18.0
  EXACT_NPM_VERSION: 11.16.0
  EXACT_PNPM_VERSION: 11.1.3
  HOSTINGER_OPS_BRANCH: hostinger-ops-production

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.3

      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify runtime contract
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = "$EXACT_NODE_VERSION"
          test "$(npm --version)" = "$EXACT_NPM_VERSION"
          test "$(pnpm --version)" = "$EXACT_PNPM_VERSION"
          test "$(tr -d '[:space:]' < .nvmrc)" = "$EXACT_NODE_VERSION"
          test "$(tr -d '[:space:]' < .node-version)" = "$EXACT_NODE_VERSION"

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Marketing publish surface
        run: pnpm marketing:check

      - name: Deploy automation self-tests
        run: |
          set -euo pipefail
          node scripts/verify-hostinger-ops-deploy-tree.mjs self-test
          node scripts/verify-production-deploy.mjs self-test
          bash -n scripts/publish-hostinger-ops-branch.sh
          bash scripts/publish-hostinger-ops-branch.sh self-test
          bash -n scripts/pack-ops-standalone.sh
          bash scripts/pack-ops-standalone.sh self-test

      - name: Lint
        run: pnpm lint

      - name: Workspace typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Production dependency audit
        run: pnpm security:audit

      - name: Ops production build
        env:
          BETTER_AUTH_URL: https://app.perfumeaura.com
          STANDALONE_SOURCE_COMMIT: ${{ github.sha }}
        run: pnpm build:ops

  integration:
    name: postgresql-16-integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: perfume_aura_phase06_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d perfume_aura_phase06_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase06_ci
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase06_ci
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase06_ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.3

      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify runtime contract
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = "$EXACT_NODE_VERSION"
          test "$(npm --version)" = "$EXACT_NPM_VERSION"
          test "$(pnpm --version)" = "$EXACT_PNPM_VERSION"

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Apply forward migrations
        run: pnpm db:migrate

      - name: Complete integration suite (no skips)
        run: pnpm test:integration

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review changed dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  package:
    name: verified-hostinger-zip
    needs:
      - quality
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: perfume_aura_phase06_package
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d perfume_aura_phase06_package"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase06_package
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase06_package
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@127.0.0.1:5432/perfume_aura_phase06_package
      BETTER_AUTH_URL: https://app.perfumeaura.com
      STANDALONE_REQUIRE_SERVER_SMOKE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.3

      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify runtime contract
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = "$EXACT_NODE_VERSION"
          test "$(npm --version)" = "$EXACT_NPM_VERSION"
          test "$(pnpm --version)" = "$EXACT_PNPM_VERSION"

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Apply forward migrations for server smoke
        run: pnpm db:migrate

      - name: Build and verify standalone archive
        run: |
          set -euo pipefail
          export STANDALONE_SOURCE_COMMIT="$GITHUB_SHA"
          export STANDALONE_STAMP="${GITHUB_SHA:0:12}"
          pnpm ops:pack

      - name: Verify checksum and release metadata
        id: artifact
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          ZIP="dist/perfume-aura-standalone_${SHORT_SHA}.zip"
          CHECKSUM="${ZIP}.sha256"
          MANIFEST="dist/perfume-aura-standalone_${SHORT_SHA}.manifest.json"
          test -f "$ZIP"
          test -f "$CHECKSUM"
          test -f "$MANIFEST"
          (cd dist && sha256sum --check "$(basename "$CHECKSUM")")
          node - "$MANIFEST" "$GITHUB_SHA" <<'NODE'
          const assert = require("node:assert/strict");
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const [manifestPath, sourceCommit] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          assert.equal(manifest.source.commit, sourceCommit);
          assert.equal(manifest.source.dirty, false);
          assert.equal(manifest.runtime.node, "24.18.0");
          assert.equal(manifest.runtime.npm, "11.16.0");
          assert.equal(manifest.runtime.pnpm, "11.1.3");
          assert.equal(manifest.runtime.next, "16.2.11");
          assert.equal(manifest.runtime.sharp, "0.35.3");
          assert.equal(manifest.runtime.postcss, "8.5.22");
          const runtimeLockSha256 = crypto
            .createHash("sha256")
            .update(fs.readFileSync("scripts/ops-runtime-deps/package-lock.json"))
            .digest("hex");
          assert.deepEqual(manifest.runtimeDependencyLock, {
            source: "scripts/ops-runtime-deps/package-lock.json",
            artifact: "runtime-package-lock.json",
            sha256: runtimeLockSha256,
          });
          assert.ok(manifest.archive.bytes <= 50_000_000);
          NODE
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"
          echo "artifact_name=ops-standalone-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload inspected artifact
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ops-standalone-${{ steps.artifact.outputs.short_sha }}
          path: |
            ${{ steps.artifact.outputs.zip }}
            ${{ steps.artifact.outputs.checksum }}
            ${{ steps.artifact.outputs.manifest }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-hostinger-ops:
    name: publish-hostinger-ops-branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Serialize deploy-branch updates. Started publish finishes; ancestry guard
    # prevents deploying an older source over a newer already-published source.
    concurrency:
      group: publish-hostinger-ops-production
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout scripts only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Resolve artifact name
        id: meta
        run: |
          set -euo pipefail
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Download exact package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ops-standalone-${{ steps.meta.outputs.short_sha }}
          path: dist-publish

      - name: Re-verify artifact and publish generated branch
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          ZIP="dist-publish/perfume-aura-standalone_${SHORT_SHA}.zip"
          CHECKSUM="${ZIP}.sha256"
          MANIFEST="dist-publish/perfume-aura-standalone_${SHORT_SHA}.manifest.json"
          test -f "$ZIP"
          test -f "$CHECKSUM"
          test -f "$MANIFEST"
          (
            cd dist-publish
            sha256sum --check "$(basename "$CHECKSUM")"
          )
          node - "$MANIFEST" "$GITHUB_SHA" <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const [manifestPath, sourceCommit] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          assert.equal(manifest.source.commit, sourceCommit);
          assert.equal(manifest.source.dirty, false);
          assert.equal(manifest.entry, "apps/ops/server.js");
          assert.ok(manifest.archive && manifest.archive.sha256);
          NODE

          TREE="$(mktemp -d "${RUNNER_TEMP}/hostinger-ops-tree.XXXXXX")"
          cleanup() {
            rm -rf -- "$TREE"
          }
          trap cleanup EXIT

          # Fail-closed ZIP preflight + extract (allows safe relative pnpm symlinks).
          python3 scripts/extract-hostinger-ops-zip.py "$ZIP" "$TREE"
          node scripts/verify-hostinger-ops-deploy-tree.mjs "$TREE" "$GITHUB_SHA"
          bash scripts/publish-hostinger-ops-branch.sh \
            --tree "$TREE" \
            --commit "$GITHUB_SHA" \
            --branch "$HOSTINGER_OPS_BRANCH" \
            --remote origin

  verify-hostinger-ops:
    name: verify-hostinger-ops-live
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.HOSTINGER_OPS_AUTO_DEPLOY_ENABLED == 'true'
    needs:
      - publish-hostinger-ops
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Poll live version and smoke surfaces
        run: |
          set -euo pipefail
          node scripts/verify-production-deploy.mjs "$GITHUB_SHA" \
            --public-surface marketing \
            --public-base https://perfumeaura.com \
            --timeout-ms 1200000
