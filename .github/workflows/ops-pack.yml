# Path B — CI builds the Hostinger Path Z standalone zip as an artifact.
# This workflow never deploys. Ops deployment is a manual hPanel ZIP upload.
# Marketing Path M stays classic Git (separate).
name: ops-pack
# CI builds with Node 24.18.0 from .nvmrc; Hostinger runs Node 24.x.

on:
  push:
    branches: [main]
    paths:
      - "apps/ops/**"
      - "packages/**"
      - "scripts/pack-ops-standalone.sh"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".node-version"
      - ".github/workflows/ops-pack.yml"
  workflow_dispatch:

concurrency:
  group: ops-pack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  pack:
    name: pack standalone zip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Build-time only — never production secrets. Runtime secret stays hPanel.
      BETTER_AUTH_URL: https://app.perfumeaura.com
      NEXT_PUBLIC_BETTER_AUTH_URL: https://app.perfumeaura.com
      # Satisfy modules that read env at import during next build
      BETTER_AUTH_SECRET: ci-build-only-not-for-runtime-use-32b
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Pack ops standalone (Path Z)
        run: pnpm ops:pack

      - name: Assert zip looks like full standalone
        run: |
          set -euo pipefail
          ZIP="$(ls -1t dist/perfume-aura-standalone_*.zip | head -1)"
          BYTES="$(wc -c < "$ZIP" | tr -d ' ')"
          MB="$(python3 -c "print(round($BYTES/1024/1024, 1))")"
          echo "zip=$ZIP bytes=$BYTES (${MB}MB)"
          # Full standalone should be well above tiny broken flats (~9MB)
          test "$BYTES" -gt 15000000

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ops-standalone-zip
          path: dist/perfume-aura-standalone_*.zip
          if-no-files-found: error
          retention-days: 14
