# PostgreSQL is only on an internal Docker network plus a host-loopback owner
# port. Nothing is public; PostgreSQL still requires SCRAM for every TCP client.
# Inside the container, only the postgres OS user (pgBackRest, the healthcheck,
# RUNBOOK psql) may reach the socket, and pg_ident.conf maps it to the owner role.

local   all             perfume_aura_owner                      peer map=container_owner
local   all             all                                     scram-sha-256
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::0/0                   scram-sha-256
