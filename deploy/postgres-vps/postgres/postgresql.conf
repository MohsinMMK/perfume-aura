# Version-controlled PostgreSQL 17 baseline. Capacity tuning must follow a
# measured VPS rehearsal; do not copy production credentials into this file.

listen_addresses = '*'
port = 5432

# The raw PostgreSQL port has no host publication. The only clients are the two
# PgBouncer containers and loopback-only pgAdmin on database_internal.
ssl = off
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = 'scram-sha-256'

# Pooling bounds backend connections. These values are deliberately modest for
# the initial single-VPS deployment and must be revisited after load evidence.
max_connections = 120
shared_buffers = '512MB'
effective_cache_size = '1536MB'
maintenance_work_mem = '128MB'
work_mem = '8MB'

# Point-in-time recovery through pgBackRest. The first WAL segment is not safe
# until RUNBOOK.md's stanza-create and check steps pass.
wal_level = replica
archive_mode = on
archive_timeout = '5min'
archive_command = 'pgbackrest --config=/run/secrets/pgbackrest_config --stanza=perfume_aura archive-push %p'
restore_command = 'pgbackrest --config=/run/secrets/pgbackrest_config --stanza=perfume_aura archive-get %f %p'

# RUNBOOK.md gates rehearsal and cutover on pg_stat_archiver.failed_count.
track_activities = on
track_counts = on

logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_connections = on
log_disconnections = on
log_min_duration_statement = '1000ms'
