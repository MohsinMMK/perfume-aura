[databases]
# Keep the target database name fixed to avoid turning PgBouncer into a generic
# database router. The migration bootstrap creates this database explicitly.
perfume_aura = host=postgres port=5432 dbname=perfume_aura

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

# A client must present a certificate signed by the private CA and also pass
# SCRAM authentication. PgBouncer 1.25.2 treats verify-full as verify-ca for
# clients; the hostname check belongs to each application's TLS client.
auth_type = scram-sha-256
auth_file = /run/secrets/pgbouncer_userlist
client_tls_sslmode = verify-full
client_tls_ca_file = /run/secrets/pgbouncer_tls_ca
client_tls_cert_file = /run/secrets/pgbouncer_tls_server_cert
client_tls_key_file = /run/secrets/pgbouncer_tls_server_key
client_tls_protocols = secure
client_tls_ciphers = secure

pool_mode = transaction
max_client_conn = 180
default_pool_size = 15
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 40
max_user_connections = 20
max_prepared_statements = 200

ignore_startup_parameters = extra_float_digits,options
application_name_add_host = 1
server_reset_query_always = 0
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 10
server_login_retry = 5
query_wait_timeout = 30
client_login_timeout = 15
idle_transaction_timeout = 120

log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 60

# PostgreSQL has no published port and is only on database_internal.
server_tls_sslmode = disable
