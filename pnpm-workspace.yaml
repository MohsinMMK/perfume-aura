packages:
  - "apps/*"
  - "packages/*"

# pnpm 11's default minimumReleaseAge quarantines releases for 24 hours.
confirmModulesPurge: false
minimumReleaseAgeExclude:
  # Exact versions reviewed in this dependency update; later releases remain
  # subject to pnpm 11's default 24-hour quarantine.
  - "@next/env@16.3.6"
  - "@next/eslint-plugin-next@16.3.6"
  - "@next/swc-darwin-arm64@16.3.6"
  - "@next/swc-darwin-x64@16.3.6"
  - "@next/swc-linux-arm64-gnu@16.3.6"
  - "@next/swc-linux-arm64-musl@16.3.6"
  - "@next/swc-linux-x64-gnu@16.3.6"
  - "@next/swc-linux-x64-musl@16.3.6"
  - "@next/swc-win32-arm64-msvc@16.3.6"
  - "@next/swc-win32-x64-msvc@16.3.6"
  - "@posthog/browser-common@0.7.1"
  - "@posthog/core@1.50.1"
  - "eslint-config-next@16.3.6"
  - "next@16.3.6"
  - "posthog-js@1.424.0"

overrides:
  sharp: "0.35.5"
  postcss: "8.5.29"
  # Temporary transitive security overrides; remove when parent ranges are patched.
  "@hono/node-server@1.19.14": "2.0.10"
  brace-expansion: "5.0.12"
  dompurify: "3.4.16"
  "esbuild@0.18.20": "0.25.12"
  fast-uri: "3.1.8"
  hono: "4.13.7"
  ip-address: "10.7.1"
  js-yaml: "4.3.2"
  nanoid: "3.3.18"
  qs: "6.16.0"
  source-map-js: "1.2.2"
  proxy-addr: "2.0.8"
  postcss-selector-parser: "7.1.6"
  "@modelcontextprotocol/sdk": "1.31.0"
  undici: "7.29.1"

allowBuilds:
  '@sentry/cli': true
  core-js: false
  esbuild: true
  sharp: true
  unrs-resolver: true
patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
