packages:
  - "apps/*"
  - "packages/*"

# pnpm's default minimumReleaseAge quarantines releases for 24 hours. Add an
# exact-version minimumReleaseAgeExclude entry only for a reviewed release that
# must land before it clears.

overrides:
  sharp: "0.35.5"
  postcss: "8.5.32"
  # Temporary transitive security overrides; remove when parent ranges are patched.
  brace-expansion: "5.0.12"
  dompurify: "3.4.17"
  "esbuild@0.18.20": "0.25.12"
  fast-uri: "3.1.9"
  ip-address: "10.7.5"
  nanoid: "3.3.20"
  source-map-js: "1.2.2"
  postcss-selector-parser: "7.1.7"
  undici: "7.30.1"

peerDependencyRules:
  # Latest releases still cap their eslint peer at 9; lint rules are verified on 10.
  allowedVersions:
    "eslint-plugin-import>eslint": "10"
    "eslint-plugin-jsx-a11y>eslint": "10"
    "eslint-plugin-react>eslint": "10"

allowBuilds:
  # Astryx's postinstalls only print an `astryx init` hint.
  '@astryxdesign/cli': false
  '@astryxdesign/core': false
  '@sentry/cli': true
  core-js: false
  esbuild: true
  sharp: true
  unrs-resolver: true
patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
