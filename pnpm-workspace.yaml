packages:
  - "apps/*"
  - "packages/*"

# pnpm's default minimumReleaseAge quarantines releases for 24 hours.
minimumReleaseAgeExclude:
  # Exact versions reviewed in this dependency update; later releases remain
  # subject to pnpm's default 24-hour quarantine.
  - "@next/env@16.4.3"
  - "@next/eslint-plugin-next@16.4.3"
  - "@next/swc-darwin-arm64@16.4.3"
  - "@next/swc-darwin-x64@16.4.3"
  - "@next/swc-linux-arm64-gnu@16.4.3"
  - "@next/swc-linux-arm64-musl@16.4.3"
  - "@next/swc-linux-x64-gnu@16.4.3"
  - "@next/swc-linux-x64-musl@16.4.3"
  - "@next/swc-win32-arm64-msvc@16.4.3"
  - "@next/swc-win32-x64-msvc@16.4.3"
  - "eslint-config-next@16.4.3"
  - "next@16.4.3"

overrides:
  sharp: "0.35.5"
  postcss: "8.5.32"
  # Temporary transitive security overrides; remove when parent ranges are patched.
  brace-expansion: "5.0.12"
  dompurify: "3.4.17"
  "esbuild@0.18.20": "0.25.12"
  fast-uri: "3.1.9"
  ip-address: "10.7.5"
  nanoid: "3.3.20"
  source-map-js: "1.2.2"
  postcss-selector-parser: "7.1.7"
  undici: "7.30.1"

peerDependencyRules:
  # Latest releases still cap their eslint peer at 9; lint rules are verified on 10.
  allowedVersions:
    "eslint-plugin-import>eslint": "10"
    "eslint-plugin-jsx-a11y>eslint": "10"
    "eslint-plugin-react>eslint": "10"

allowBuilds:
  # Astryx's postinstalls only print an `astryx init` hint.
  '@astryxdesign/cli': false
  '@astryxdesign/core': false
  '@sentry/cli': true
  core-js: false
  esbuild: true
  sharp: true
  unrs-resolver: true
patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
