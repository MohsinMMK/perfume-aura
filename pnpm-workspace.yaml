packages:
  - "apps/*"
  - "packages/*"

overrides:
  sharp: "0.35.3"
  postcss: "8.5.22"
  # Temporary transitive security overrides; remove when parent ranges are patched.
  "@hono/node-server@1.19.14": "2.0.10"
  brace-expansion: "5.0.8"
  "esbuild@0.18.20": "0.25.12"

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
