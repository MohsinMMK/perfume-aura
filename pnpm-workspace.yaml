packages:
  - "apps/*"
  - "packages/*"

overrides:
  sharp: "0.35.3"
  postcss: "8.5.23"
  # Temporary transitive security overrides; remove when parent ranges are patched.
  "@hono/node-server@1.19.14": "2.0.10"
  brace-expansion: "5.0.9"
  "esbuild@0.18.20": "0.25.12"
  fast-uri: "3.1.5"
  hono: "4.12.34"
  ip-address: "10.3.1"
  js-yaml: "4.3.1"
  nanoid: "3.3.18"
  undici: "7.29.0"

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
allowBuilds:
  '@sentry/cli': true
  core-js: false
  esbuild: true
  sharp: true
  unrs-resolver: true
patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
