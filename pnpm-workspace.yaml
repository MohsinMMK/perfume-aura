packages:
  - "apps/*"
  - "packages/*"

# pnpm 11's default minimumReleaseAge quarantines releases for 24 hours.
confirmModulesPurge: false
minimumReleaseAgeExclude:
  # Exact versions reviewed in this dependency update; later releases remain
  # subject to pnpm 11's default 24-hour quarantine.
  - "@next/env@16.3.4"
  - "@next/eslint-plugin-next@16.3.4"
  - "@next/swc-darwin-arm64@16.3.4"
  - "@next/swc-darwin-x64@16.3.4"
  - "@next/swc-linux-arm64-gnu@16.3.4"
  - "@next/swc-linux-arm64-musl@16.3.4"
  - "@next/swc-linux-x64-gnu@16.3.4"
  - "@next/swc-linux-x64-musl@16.3.4"
  - "@next/swc-win32-arm64-msvc@16.3.4"
  - "@next/swc-win32-x64-msvc@16.3.4"
  - "@posthog/browser-common@0.7.1"
  - "@posthog/core@1.50.1"
  - "eslint-config-next@16.3.4"
  - "next@16.3.4"
  - "posthog-js@1.424.0"

overrides:
  sharp: "0.35.3"
  postcss: "8.5.23"
  # Temporary transitive security overrides; remove when parent ranges are patched.
  "@hono/node-server@1.19.14": "2.0.10"
  brace-expansion: "5.0.9"
  "esbuild@0.18.20": "0.25.12"
  fast-uri: "3.1.5"
  hono: "4.12.34"
  ip-address: "10.3.1"
  js-yaml: "4.3.1"
  nanoid: "3.3.18"
  qs: "6.16.0"
  undici: "7.29.0"

allowBuilds:
  '@sentry/cli': true
  core-js: false
  esbuild: true
  sharp: true
  unrs-resolver: true
patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
